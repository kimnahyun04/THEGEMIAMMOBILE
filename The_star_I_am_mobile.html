      cardsBox.innerHTML = stones
        .map(
          (s, i) =>
            `<button type="button" class="card" style="--x:${fan[i][0]}%;--y:${fan[i][1]}%;--r:${fan[i][2]}deg;--lx:${fan[i][3]}%;--ly:${fan[i][4]}%;--lr:${fan[i][5]}deg" data-i="${i}" aria-label="${s[6]} ${s[7] || s[2]} 카드 자세히 보기" disabled><img class="card-img" src="${s[5]}" alt="" decoding="async"><span class="card-text"><span class="card-name">${s[6]}</span><span class="card-month">${s[7] || s[2]}</span></span></button>`,
        )
        .join("");
      const cards = $$(".card"),
        ids = [
          "showKicker",
          "showName",
          "showDesc",
          "detailKicker",
          "detailName",
          "detailDesc",
          "nextHint",
        ].reduce((o, id) => ((o[id] = $("#" + id)), o), {});
      const showcase = $(".showcase");
      let current = 0,
        animating = false,
        playing = false,
        hasInteracted = false,
        textTimer;
      const sounds = {
        bgm: $("#bgm"),
        hover: $("#hoverSfx"),
        open: $("#openSfx"),
        close: $("#closeSfx"),
      };
      const play = (audio, volume) => {
        audio.currentTime = 0;
        audio.volume = volume;
        audio.play().catch(() => {});
      };
      const setSound = (on) => {
        $("#sound").classList.toggle("playing", on);
        $("#sound").classList.toggle("paused", !on);
        $("#sound").setAttribute("aria-pressed", String(on));
        $("#sound").setAttribute("aria-label", on ? "배경 음악 끄기" : "배경 음악 켜기");
        $("#soundState").textContent = on ? "MUSIC ON" : "MUSIC OFF";
        $("#soundState").dataset.active = String(on);
      };
      const startBgm = async () => {
        sounds.bgm.volume = 0.15;
        try {
          await sounds.bgm.play();
          playing = true;
          setSound(true);
        } catch {
          playing = false;
          setSound(false);
        }
      };
      document.addEventListener(
        "click",
        () => {
          if (hasInteracted) return;
          hasInteracted = true;
          if (!playing) startBgm();
        },
        { once: true },
      );
      $("#sound").onclick = async (e) => {
        e.stopPropagation();
        hasInteracted = true;
        if (sounds.bgm.paused) {
          await startBgm();
        } else {
          sounds.bgm.pause();
          playing = false;
          setSound(false);
        }
      };
      const update = (index) => {
        const total = cards.length,
          prev = (index - 1 + total) % total,
          next = (index + 1) % total;
        cards.forEach((card, i) => {
          card.className = "card";
          card.disabled = ![index, prev, next].includes(i);
          card.setAttribute("aria-current", i === index ? "true" : "false");
          card.style.removeProperty("left");
          card.style.removeProperty("top");
          card.style.removeProperty("width");
          card.style.removeProperty("opacity");
          card.style.removeProperty("z-index");
          card.style.removeProperty("transform");
          if (i === index) card.classList.add("show-center");
          else if (i === prev) card.classList.add("show-prev");
          else if (i === next) card.classList.add("show-next");
          else card.classList.add("show-far");
        });
        const s = stones[index],
          n = stones[next];
        ids.showKicker.textContent =
          ids.detailKicker.textContent = `${s[2]} · ${s[3]}`;
        ids.showName.textContent = ids.detailName.textContent = s[1];
        ids.showDesc.textContent = ids.detailDesc.textContent = s[4];
        ids.nextHint.textContent = `NEXT · ${n[1]}`;
        $$(".dot").forEach((dot, i) => {
          dot.classList.toggle("active", i === index);
          dot.setAttribute("aria-current", i === index ? "true" : "false");
        });
      };
      const revealText = () => {
        requestAnimationFrame(() =>
          requestAnimationFrame(() => showcase.classList.remove("text-hidden")),
        );
      };
      const go = (dir) => {
        if (animating || !["showcase", "detail"].includes(body.dataset.mode))
          return;
        animating = true;
        clearTimeout(textTimer);
        showcase.classList.add("text-hidden");
        const nextIndex = (current + dir + cards.length) % cards.length;
        play(sounds.hover, 0.35);
        textTimer = setTimeout(() => {
          current = nextIndex;
          update(current);
          revealText();
        }, 140);
        setTimeout(() => (animating = false), 680);
      };
      $("#startBtn").onclick = () => {
        if (animating || body.dataset.mode !== "fan") return;
        animating = true;
        play(sounds.open, 0.45);
        $("#startCta").style.opacity = 0;
        $("#bigTitle").style.opacity = 0;
        $("#centerCopy").style.opacity = 0;
        cards.forEach((card, i) => {
          card.style.setProperty("--gather-rot", `${(i - 5.5) * 1.6}deg`);
          card.style.zIndex = 3 + i;
        });
        showcase.classList.add("text-hidden");
        requestAnimationFrame(() => (body.dataset.mode = "gathering"));
        setTimeout(() => {
          body.dataset.mode = "showcase";
          current = 0;
          update(0);
          revealText();
          animating = false;
        }, 760);
      };
      $("#indicators").innerHTML = stones
        .map(
          (_, i) =>
            `<button type="button" class="dot${i ? "" : " active"}" data-i="${i}" aria-label="${stones[i][6]} 카드 보기"></button>`,
        )
        .join("");
      $("#indicators").onclick = (e) => {
        const dot = e.target.closest(".dot");
        if (!dot || body.dataset.mode !== "showcase" || animating) return;
        animating = true;
        clearTimeout(textTimer);
        showcase.classList.add("text-hidden");
        const nextIndex = +dot.dataset.i;
        play(sounds.hover, 0.35);
        textTimer = setTimeout(() => {
          current = nextIndex;
          update(current);
          revealText();
        }, 140);
        setTimeout(() => (animating = false), 680);
      };
      $("#prev").onclick = $("#miniPrev").onclick = () => go(-1);
      $("#next").onclick = $("#miniNext").onclick = () => go(1);
      cardsBox.onclick = (e) => {
        const card = e.target.closest(".card");
        if (!card || animating) return;
        if (body.dataset.mode === "showcase") {
          if (card.classList.contains("show-prev")) go(-1);
          else if (card.classList.contains("show-next")) go(1);
          else if (card.classList.contains("show-center")) openDetail();
        } else if (
          body.dataset.mode === "detail" &&
          card.classList.contains("show-center")
        )
          navigate();
      };
      const openDetail = () => {
        if (animating || body.dataset.mode !== "showcase") return;
        animating = true;
        play(sounds.open, 0.45);
        body.dataset.mode = "detail";
        setTimeout(() => (animating = false), 480);
      };
      const closeDetail = () => {
        if (animating) return;
        animating = true;
        play(sounds.close, 1);
        body.dataset.mode = "showcase";
        setTimeout(() => (animating = false), 480);
      };
      $("#explore").onclick = openDetail;
      $("#detailClose").onclick = closeDetail;
      const navigate = () => {
        const link = stones[current][0];
        if (!link) return;
        $("#transition").classList.add("show");
        play(sounds.open, 0.45);
        setTimeout(() => (location.href = link), 800);
      };
      $("#learn").onclick = navigate;
      $("#backGallery").onclick = () => {
        if (animating) return;
        animating = true;
        play(sounds.close, 1);
        cards.forEach((card, i) => {
          card.className = "card";
          card.style.setProperty("--gather-rot", `${(i - 5.5) * 2}deg`);
          card.style.opacity = 1;
          card.style.zIndex = 20 + i;
        });
        body.dataset.mode = "returning";
        setTimeout(() => {
          body.dataset.mode = "fan";
          cards.forEach((card) => {
            card.disabled = true;
            card.setAttribute("aria-current", "false");
            ["left", "top", "width", "opacity", "z-index", "transform"].forEach(
              (p) => card.style.removeProperty(p),
            );
          });
          Object.assign($("#startCta").style, { display: "flex", opacity: 1 });
          $("#bigTitle").style.opacity = "";
          $("#centerCopy").style.opacity = "";
          animating = false;
        }, 620);
      };
      const panel = $("#panel"),
        menu = $("#menuScreen"),
        notes = $("#notesScreen");
      const setPanelOpen = (open) => {
        panel.classList.toggle("show", open);
        panel.toggleAttribute("inert", !open);
        panel.setAttribute("aria-hidden", String(!open));
        $("#menuToggle").setAttribute("aria-expanded", String(open));
        $("#menuToggle").setAttribute("aria-label", open ? "메뉴 닫기" : "메뉴 열기");
        if (open) $("#panelClose").focus();
        else $("#menuToggle").focus();
      };
      $("#menuToggle").onclick = () => setPanelOpen(!panel.classList.contains("show"));
      $("#panelClose").onclick = () => setPanelOpen(false);
      panel.onclick = (e) => {
        const go = e.target.closest("[data-go]");
        if (go) location.href = go.dataset.go;
      };
      $("#openNotes").onclick = () => {
        menu.classList.add("hidden");
        notes.classList.remove("hidden");
        $("#stoneName").focus();
      };
      $("#backMenu").onclick = () => {
        notes.classList.add("hidden");
        menu.classList.remove("hidden");
        $("#openNotes").focus();
      };
      document.onkeydown = (e) => {
        const isEditing = e.target.matches("input, textarea");
        if (!isEditing && e.key === "ArrowLeft") go(-1);
        if (!isEditing && e.key === "ArrowRight") go(1);
        if (e.key === "Escape") {
          if (panel.classList.contains("show")) setPanelOpen(false);
          else if (body.dataset.mode === "detail") closeDetail();
          else if (body.dataset.mode === "showcase") $("#backGallery").click();
        }
      };
      const MAX_NOTES = 20,
        key = "birthstarNotes",
        fields = [$("#stoneName"), $("#stoneMeaning"), $("#stoneMemo")],
        loadNotes = () => {
          try {
            const saved = JSON.parse(localStorage.getItem(key));
            return Array.isArray(saved) ? saved.slice(0, MAX_NOTES) : [];
          } catch {
            return [];
          }
        },
        saveNotes = (notesToSave) => {
          try {
            localStorage.setItem(key, JSON.stringify(notesToSave.slice(0, MAX_NOTES)));
            return true;
          } catch {
            return false;
          }
        },
        esc = (s) =>
          String(s || "-").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
      const renderNotes = () => {
        const list = loadNotes();
        $("#savedList").innerHTML = list.length
          ? list
              .map(
                (n, i) =>
                  `<article class="saved-item"><div class="saved-stone">${esc(n.name)}</div><div class="saved-meaning">${esc(n.meaning)}</div><div class="saved-memo">${esc(n.memo)}</div><button type="button" class="delete-note" data-delete="${i}">삭제</button></article>`,
              )
              .join("")
          : '<div class="empty">아직 저장된 기록이 없습니다.</div>';
      };
      $("#saveNote").onclick = () => {
        const [name, meaning, memo] = fields.map((f) => f.value.trim());
        if (!name && !meaning && !memo) return;
        const list = loadNotes();
        list.unshift({ name, meaning, memo });
        if (!saveNotes(list)) return;
        fields.forEach((f) => (f.value = ""));
        renderNotes();
      };
      $("#savedList").onclick = (e) => {
        const b = e.target.closest("[data-delete]");
        if (!b) return;
        const list = loadNotes();
        list.splice(+b.dataset.delete, 1);
        saveNotes(list);
        renderNotes();
      };
      renderNotes();
    </script>
  </body>
</html>
