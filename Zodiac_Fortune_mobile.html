<!DOCTYPE html>
<html lang="ko" data-theme="zodiac">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111638" />
  <title>Zodiac Fortune Draw · Mobile</title>
  <style>
    :root {
      --bg: #070a19;
      --bg-accent: #18214f;
      --surface: rgba(20, 27, 65, .96);
      --surface-strong: #202858;
      --line: rgba(255,255,255,.18);
      --text: #f8f7f2;
      --muted: rgba(248,247,242,.68);
      --accent: #e4cf99;
      --button-bg: #f4f1e8;
      --button-text: #2d3150;
      --danger: #f2a7b0;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-width: 280px;
      min-height: 100svh;
      margin: 0;
      color: var(--text);
      background: linear-gradient(180deg, var(--bg-accent), var(--bg));
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      overflow-x: hidden;
    }

    button,
    input { font: inherit; }

    button,
    a { -webkit-tap-highlight-color: transparent; }

    [hidden] { display: none !important; }

    .topbar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(100%, 520px);
      margin: 0 auto;
      padding: max(16px, env(safe-area-inset-top)) 16px 0;
    }

    .home-link,
    .music-btn {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      background: var(--surface-strong);
      text-decoration: none;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      padding: 0 15px;
      font-size: 12px;
      font-weight: 700;
    }

    .music-wrap { position: relative; }

    .music-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 13px;
      cursor: pointer;
    }

    .music-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
    }

    .music-btn.playing .music-dot {
      box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 18%, transparent);
    }

    .music-label {
      min-width: 53px;
      font-size: 11px;
      letter-spacing: .06em;
    }

    .music-credit {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: min(300px, calc(100vw - 32px));
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--muted);
      background: var(--surface-strong);
      font-size: 10px;
      line-height: 1.45;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-4px);
      transition: opacity .2s ease, transform .2s ease, visibility .2s;
      pointer-events: none;
    }

    .music-btn.playing + .music-credit {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .music-credit strong,
    .music-credit span { display: block; }

    .music-credit strong { color: var(--text); }

    .app {
      width: min(100%, 520px);
      margin: 0 auto;
      padding: 18px 16px max(40px, env(safe-area-inset-bottom));
    }

    .screen {
      padding: clamp(24px, 7vw, 34px) 20px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: var(--surface);
    }

    .kicker,
    .result-kicker {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 11vw, 54px);
      font-weight: 400;
      line-height: .98;
      letter-spacing: -.045em;
    }

    h1 span {
      display: block;
      margin-top: 9px;
      color: var(--muted);
      font-size: .48em;
      font-style: italic;
    }

    .intro,
    .form-copy,
    .fortune-copy,
    .meta-text {
      color: var(--muted);
      word-break: keep-all;
    }

    .intro {
      margin: 18px 0 28px;
      font-size: 14px;
      line-height: 1.72;
    }

    .form-copy {
      margin: 0 0 22px;
      font-size: 13px;
      line-height: 1.65;
    }

    .label {
      display: block;
      margin-bottom: 9px;
      color: var(--text);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .input,
    .primary,
    .secondary {
      width: 100%;
      min-height: 54px;
      border-radius: 15px;
    }

    .input {
      padding: 0 15px;
      border: 1px solid var(--line);
      outline: none;
      color: var(--text);
      color-scheme: dark;
      background: var(--surface-strong);
    }

    .input:focus {
      border-color: var(--accent);
      outline: 3px solid color-mix(in srgb, var(--accent) 15%, transparent);
    }

    .error {
      min-height: 20px;
      margin: 8px 2px 0;
      color: var(--danger);
      font-size: 12px;
    }

    .primary,
    .secondary {
      border: 0;
      cursor: pointer;
      font-weight: 800;
    }

    .primary {
      margin-top: 5px;
      color: var(--button-text);
      background: var(--button-bg);
    }

    .secondary {
      margin-top: 22px;
      border: 1px solid var(--line);
      color: var(--text);
      background: var(--surface-strong);
    }

    .helper {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 10px;
      text-align: center;
    }

    .card-area {
      display: grid;
      place-items: center;
      margin-bottom: 26px;
    }

    .fortune-card {
      width: min(66vw, 250px);
      aspect-ratio: .68;
    }

    .card-image {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 18px;
      object-fit: contain;
      opacity: 0;
      transition: opacity .22s ease;
      user-select: none;
      pointer-events: none;
    }

    .card-image.loaded { opacity: 1; }

    .result-copy { text-align: center; }

    .stone-name {
      margin: 0 0 11px;
      color: var(--accent);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(31px, 9vw, 42px);
      font-weight: 400;
      line-height: 1;
      word-break: keep-all;
    }

    .fortune-title {
      margin: 0 0 13px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(24px, 7vw, 31px);
      font-weight: 400;
      line-height: 1.22;
      letter-spacing: -.03em;
      word-break: keep-all;
    }

    .fortune-copy {
      margin: 0;
      font-size: 14px;
      line-height: 1.75;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;
      margin: 18px 0;
    }

    .chip-item {
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: var(--surface-strong);
      font-size: 11px;
    }

    .fortune-meta {
      display: grid;
      gap: 9px;
      margin-top: 18px;
      text-align: left;
    }

    .meta-box {
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface-strong);
    }

    .meta-label {
      display: block;
      margin-bottom: 4px;
      color: var(--accent);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .meta-text {
      font-size: 13px;
      line-height: 1.55;
    }

    .birth-text {
      margin: 15px 0 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.6;
    }

    .screen.reveal {
      animation: reveal .28s ease both;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 340px) {
      .topbar { padding-inline: 10px; }
      .app { padding-inline: 10px; }
      .screen { padding-inline: 16px; }
      .home-link { padding-inline: 12px; }
      .music-btn { padding-inline: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

      </div>
    </section>
  </main>

  function playSound(audio) {
    audio.pause();
    audio.currentTime = 0;
    const promise = audio.play();
    if (promise) promise.catch(() => {});
  }

  function localToday() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");
    return year + "-" + month + "-" + day;
  }

  function parseDate(value) {
    const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
    if (!match) return null;
    const year = Number(match[1]);
    const month = Number(match[2]);
    const day = Number(match[3]);
    const check = new Date(year, month - 1, day);
    if (
      check.getFullYear() !== year ||
      check.getMonth() !== month - 1 ||
      check.getDate() !== day
    ) return null;
    return { year, month, day };
  }

  function findFortuneItem(month, day) {
    const value = month * 100 + day;
    return zodiacSigns.find((sign) => {
      const start = sign.start[0] * 100 + sign.start[1];
      const end = sign.end[0] * 100 + sign.end[1];
      return start <= end
        ? value >= start && value <= end
        : value >= start || value <= end;
    });
  }

  function pickFortune(item) {
    const previous = lastFortuneIndexes.get(item.name) ?? -1;
    let next = Math.floor(Math.random() * item.fortunes.length);
    while (item.fortunes.length > 1 && next === previous) {
      next = Math.floor(Math.random() * item.fortunes.length);
    }
    lastFortuneIndexes.set(item.name, next);
    return item.fortunes[next];
  }

    const date = parseDate(birthDateInput.value);
    if (!date) {
      errorMessage.textContent = "올바른 날짜를 입력해 주세요.";
      birthDateInput.focus();
      return;
    }

    if (birthDateInput.value > birthDateInput.max) {
      errorMessage.textContent = "오늘 이후의 날짜는 입력할 수 없어요.";
      birthDateInput.focus();
      return;
    }

    const item = findFortuneItem(date.month, date.day);
    if (!item) {
      errorMessage.textContent = "별자리 정보를 찾지 못했어요.";
      return;
    }

    fillResult(date, item);
    formView.hidden = true;
    resultView.hidden = false;
    resultView.classList.remove("reveal");
    void resultView.offsetWidth;
    resultView.classList.add("reveal");
    window.setTimeout(() => playSound(cardRevealSound), 240);
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  resetButton.addEventListener("click", () => {
    resultView.hidden = true;
    formView.hidden = false;
    cardImage.classList.remove("loaded");
    errorMessage.textContent = "";
    window.scrollTo({ top: 0, behavior: "smooth" });
    window.setTimeout(() => birthDateInput.focus(), 180);
  });
</script>
</body>
</html>
